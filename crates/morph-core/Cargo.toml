[package]
name = "morph-core"
description = "Local image and video conversion engine of Morph-Format"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "filter", "software-scaling", "software-resampling"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
img-parts = "0.4.2"
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17"], optional = true }
thiserror = "2.0.21"
webp = "0.3.1"

[dev-dependencies]
tempfile = "3.27.0"


[features]
default = []
# HEIC decoding through libheif (native library required).
heic = ["dep:libheif-rs"]
# Video conversion through FFmpeg, dynamically linked (LGPL build only).
video = ["dep:ffmpeg-next"]
