[package]
name = "morph-app"
description = "Morph-Format desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "morph-format"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
morph-core = { version = "0.1.0", path = "../morph-core" }
rfd = "0.17.2"
walkdir = "2.5.0"


[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = []
heic = ["morph-core/heic"]
video = ["morph-core/video"]
