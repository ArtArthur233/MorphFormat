# cargo-about config. Regenerate: cargo about generate --all-features about.hbs -o THIRD-PARTY-NOTICES.md
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "WTFPL",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# Windows is the shipped target; add others when binaries are built for them.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
